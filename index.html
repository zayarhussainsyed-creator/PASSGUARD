<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Strength Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Create Account</h2>

    <form id="signupForm">

        <label>Username</label>
        <input type="text" id="username" placeholder="Enter username" required>

        <label>Email or Phone Number</label>
        <div class="contact-row">
            <input type="email" id="email" placeholder="Email">
            <input type="tel" id="phone" placeholder="Phone Number">
        </div>
        <small class="note">Enter either Email or Phone Number.</small>

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>

        <button type="button" class="generate-btn" onclick="generatePassword()">
            Generate Strong Password
        </button>

        <p class="requirements">Password must contain:</p>
        <ul class="requirements-list">
            <li>Minimum 8 characters</li>
            <li>At least one uppercase letter</li>
            <li>At least one lowercase letter</li>
            <li>At least one number</li>
            <li>At least one special character (@, #, $, %, &, etc.)</li>
        </ul>

        <div id="strengthMessage" class="message"></div>

        <label>Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm password" required>

        <div id="matchMessage" class="message"></div>

        <button type="submit" class="submit-btn">Sign Up</button>

        <div class="links">
            <a href="#">Forgot Password?</a>
            <a href="#">Forgot Username?</a>
        </div>

    </form>
</div>

<script src="script.js"></script>
</body>
</html>
