<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePass Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>SecurePass Checker</h2>

        <form id="signupForm">

            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter username" required>

            <label>Email or Phone Number</label>
            <div class="contact-row">
                <input type="email" id="email" placeholder="Email">
                <input type="tel" id="phone" placeholder="Phone Number">
            </div>
            <small class="note">Enter either Email or Phone Number.</small>

            <label for="password">Password</label>
            <div class="password-box">
                <input type="password" id="password" placeholder="Enter password" required>
                <button type="button" id="toggleBtn" onclick="togglePasswords()">Show</button>
            </div>

            <button type="button" class="generate-btn" onclick="generatePassword()">
                Generate Strong Password
            </button>

            <p class="requirements">Password must contain:</p>
            <ul class="requirements-list">
                <li>Minimum 8 characters</li>
                <li>At least one uppercase letter</li>
                <li>At least one lowercase letter</li>
                <li>At least one number</li>
                <li>At least one special character (@, #, $, %, &, etc.)</li>
            </ul>

            <div id="strengthMessage" class="message"></div>

            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm password" required>

            <div id="matchMessage" class="message"></div>

            <button type="submit" class="submit-btn">Sign Up</button>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
